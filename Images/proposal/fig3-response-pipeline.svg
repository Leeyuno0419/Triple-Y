        <title id="fig3-response-pipeline-title">경로·알림 파이프라인</title>
        <desc id="fig3-response-pipeline-desc">구역 상태를 받아 위험 등급을 판정한 뒤 비상 알림, 도로 비용 갱신, 안전 구역 확인으로 나뉘고, 경로 계산이 상황실 웹과 시민 앱에 대피·우회·탈출 경로를 보내는 과정.</desc>
