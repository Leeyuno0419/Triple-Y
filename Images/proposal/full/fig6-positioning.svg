      --font-sans: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, Consolas, monospace; }
      #fig6-positioning-root { font-family: var(--font-sans); color: var(--color-ink); }
      #fig6-positioning-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#fig6-positioning-root .diagram-container { overflow-x: visible; }
