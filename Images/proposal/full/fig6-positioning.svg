        <title id="fig6-positioning-title">경쟁 포지셔닝</title>
        <desc id="fig6-positioning-desc">대응 범위(관제 경보에서 시민 행동 안내까지)와 분석 깊이(밀도에서 흐름·예측까지)로 기존 사례와 SafeRoute를 배치한 사분면. 기존 국내 솔루션은 관제·밀도 쪽에, SafeRoute는 시민·예측 쪽에 있다.</desc>
        <defs>
