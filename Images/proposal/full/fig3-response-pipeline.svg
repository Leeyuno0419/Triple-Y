      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, Consolas, monospace; }
      #fig3-response-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #fig3-response-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#fig3-response-pipeline-root .diagram-container { overflow-x: visible; }
