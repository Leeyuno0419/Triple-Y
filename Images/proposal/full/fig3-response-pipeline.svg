        <title id="fig3-response-pipeline-title">경로·대응 파이프라인</title>
        <desc id="fig3-response-pipeline-desc">구역 상태를 받아 위험 등급을 판정한 뒤 비상 알림, 도로 비용 갱신, 안전 구역 계산, 유입 차단 지점으로 나뉘고, 경로 계산이 시민 앱과 상황실·요원에게 결과를 보내는 과정.</desc>
