# 60초 예측 설정 (docs/timeline-spec.md). 코드에 하드코딩하지 말고 여기서만 조정한다.
predictor: persistence           # persistence(현재값 유지) | linear(직선 추세) | flow(흐름 이류)
history_s: 30                    # 예측 입력 기간(초). 최근 이 길이의 밀도 기록만 쓴다 (t 이후 값은 쓰지 않음)
horizon_s: 60                    # 예측 시점(초)

# flow 예측기 전용
step_s: 5.0                      # 시간 적분 간격(초)
cfl_max: 0.5                     # 한 서브스텝에서 이동 가능한 최대 셀 수 (<=0.5 권장, 안정성)
scheme: tvd                      # 이류 방식: tvd(2차, 번짐 적음) | upwind(1차, 비교/롤백용)
flow_decay_tau_s: 120.0          # 흐름 속도 시간 감쇠 상수(초). 0 이하면 감쇠 없음
max_speed_cells_per_s: 3.0       # 입력 흐름 속도 클리핑(이상치 방지)

# 평가(evaluate) 전용
eval_min_cell_area_m2: 2.0       # 보행 면적이 이 값(㎡) 이상인 셀만 모은 지표를 따로 낸다. 작은 셀은 오탐 1명에도 밀도가 튄다 (docs/decisions-2026-11-11.md #4)
